name: MM-ROBOT-DISABLE-MM-ID

# on:
#   push:
#     branches: [ "main" ]
#   pull_request:
#     branches: [ "main" ]

on:
  schedule:
     - cron: '*/5 * * * *'  # Runs every 5 minutes.

env:
  BRANCH: lance
  REPO: https://github.com/ioworker0/linux.git
  FEAT: MMID

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          path: robot

      - name: system resources
        run: |      
          uname -r && uname -m && echo $(nproc) && free -h

      - name: check against the commit ID
        id: target
        working-directory: robot
        run: |
          ./.github/scripts/target-state.sh check \
            "${{ env.BRANCH }}_${{ env.FEAT }}_previous_commit_id.txt" \
            "${{ env.REPO }}" \
            "${{ env.BRANCH }}"


      - uses: actions/cache@v6
        if: steps.target.outputs.changed == 'true'
        id: repo-cache
        with:
          path: linux
          key: linux
    
      - name: clone repo
        if: steps.repo-cache.outputs.cache-hit != 'true' && steps.target.outputs.changed == 'true'
        run: |
          ls -l
          git clone -v ${{ env.REPO }} linux
          
      - name: pre-clean up
        if: steps.target.outputs.changed == 'true'
        run: |
          cd linux
          git checkout master
          if git rev-parse --verify ${{ env.BRANCH }} >/dev/null 2>&1; then
            git branch -D ${{ env.BRANCH }}
          else
            echo "Branch ${{ env.BRANCH }} does not exist."
          fi
          make clean
          rm -rf .config*
          
      - name: check out target commit
        if: steps.target.outputs.changed == 'true'
        env:
          TARGET_SHA: ${{ steps.target.outputs.target_sha }}
        run: |
          cd linux
          git fetch origin "${{ env.BRANCH }}"
          git checkout --detach "$TARGET_SHA"

      - name: pre-build kernel x86-64
        if: steps.target.outputs.changed == 'true'
        run: |  
          sudo apt-get update
          sudo apt-get install -y libelf-dev libdwarf-dev libdw-dev

      - name: build kernel x86-64 w/o CONFIG_MM_ID
        if: steps.target.outputs.changed == 'true'
        run: |  
          cd linux
          cp $(ls /boot/config-* | shuf -n 1) .config
          sed -i 's/^# CONFIG_KASAN is not set/CONFIG_KASAN=y/' .config
          sed -i 's/^# CONFIG_KCSAN is not set/CONFIG_KCSAN=y/' .config
          scripts/config --disable TRANSPARENT_HUGEPAGE
          scripts/config --disable MM_ID
          make olddefconfig
          sed -i '/^CONFIG_SYSTEM_TRUSTED_KEYS=.*/s/.*/CONFIG_SYSTEM_TRUSTED_KEYS=""/' .config
          sed -i '/^CONFIG_SYSTEM_REVOCATION_KEYS=.*/s/.*/CONFIG_SYSTEM_REVOCATION_KEYS=""/' .config
          if grep -Eq '^CONFIG_(MM_ID|TRANSPARENT_HUGEPAGE)=[ym]$' .config; then
            echo "CONFIG_MM_ID or CONFIG_TRANSPARENT_HUGEPAGE is still enabled" >&2
            exit 1
          fi
          echo "cat .config"
          cat .config
          echo "Done: cat .config"
          make -j$(nproc) bzImage

      - name: post-build kernel x86-64 w/o CONFIG_MM_ID
        if: steps.target.outputs.changed == 'true'
        run: |  
          cd linux
          make clean
          rm -rf .config*

      - name: post-build kernel x86-64
        if: steps.target.outputs.changed == 'true'
        run: |  
          cd linux
          make clean
          rm -rf .config*

      - name: record successful commit ID
        if: steps.target.outputs.changed == 'true' && success()
        working-directory: robot
        env:
          TARGET_SHA: ${{ steps.target.outputs.target_sha }}
        run: |
          ./.github/scripts/target-state.sh record \
            "${{ env.BRANCH }}_${{ env.FEAT }}_previous_commit_id.txt" \
            "$TARGET_SHA"
